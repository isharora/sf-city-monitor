<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF City Monitor (prototype, sample data)</title>
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply theme before first paint: URL ?theme= wins, then saved preference, then OS.
  (function () {
    const q = new URLSearchParams(location.search).get('theme');
    let saved = null; try { saved = localStorage.getItem('sfcm-theme'); } catch (e) { /* ignore */ }
    const t = q || saved || 'auto';
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<a class="sr-only" href="#content">Skip to content</a>
<div class="app">
  <nav class="sidebar" aria-label="Dashboards and views">
    <div class="brand">
      <div class="brand-title" id="brand"><span class="mark"><i></i></span>SF City Monitor</div>
      <div class="brand-sub">San Francisco government, in public data</div>
      <div style="margin-top:8px"><span class="badge badge-sample">Prototype · synthetic sample data</span></div>
    </div>
    <div class="dash-switch" id="dash-switch"></div>
    <div id="nav"></div>
    <div class="sidebar-foot">
      <div id="asof"></div>
      <div class="shortcuts" style="margin-top:6px"><span><kbd>/</kbd> search</span><span><kbd>[</kbd> <kbd>]</kbd> views</span><span><kbd>s</kbd> story</span><span><kbd>d</kbd> dark</span><span><kbd>?</kbd> help</span></div>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <div class="search" id="search">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.6"/></svg>
        <input id="search-input" type="search" placeholder="Search organizations, departments, reports, officials, measures…" aria-label="Search the site" autocomplete="off">
        <div class="search-pop" id="search-pop" hidden role="listbox"></div>
      </div>
      <span class="sample-note">All numbers are <b>synthetic sample data</b> for design review; organization and official names are invented.</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="story-btn" aria-pressed="false" title="Guided story for this dashboard (s)" hidden>Story</button>
      <button class="icon-btn" id="theme-toggle" aria-pressed="false" title="Toggle dark mode (d)">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
        Dark
      </button>
      <button class="icon-btn" id="share-btn" title="Copy a link to this exact view and filters">Copy link</button>
    </header>
    <div class="filterbar" id="filterbar" role="region" aria-label="Filters"></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="storybar" id="storybar" hidden></div>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/network.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/commentary.js"></script>
<script src="js/views-np.js"></script>
<script src="js/views-pf.js"></script>
<script src="js/views-au.js"></script>
<script src="js/views-nw.js"></script>
<script src="js/views-entities.js"></script>
<script src="js/views-site.js"></script>
<script src="js/app.js"></script>
<script>document.getElementById('brand').addEventListener('click', function () { window.SFCM.state.set({ view: 'home', id: null, mode: 'explore' }); });</script>
</body>
</html>
